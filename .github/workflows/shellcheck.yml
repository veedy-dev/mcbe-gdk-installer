name: Shell checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck bootstrap.sh easy-install.sh gui.sh install.sh uninstall.sh scripts/*.sh
      - run: pip install cryptography==43.0.3
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/runtime.py scripts/runtime_engine.py scripts/gui_engine.py auth/*.py
